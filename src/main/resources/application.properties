spring.application.name=KnowFlow AI
app.cache.enabled=${CACHE_ENABLED:false}
app.idempotency.enabled=${IDEMPOTENCY_ENABLED:true}
app.idempotency.lease=${IDEMPOTENCY_LEASE:PT30S}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=true
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.window=${RATE_LIMIT_WINDOW:PT60S}
app.rate-limit.register=${RATE_LIMIT_REGISTER:5}
app.rate-limit.login=${RATE_LIMIT_LOGIN:20}
app.rate-limit.search=${RATE_LIMIT_SEARCH:60}
app.rate-limit.answer=${RATE_LIMIT_ANSWER:20}
server.forward-headers-strategy=none
spring.profiles.default=api
spring.config.import=optional:file:.env[.properties]
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/knowflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:knowflow}
spring.datasource.password=${DB_PASSWORD}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true
logging.structured.format.console=ecs
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=knowflow-ai
app.jwt.audience=knowflow-api
app.jwt.access-token-ttl=PT15M
app.document.storage-directory=${DOCUMENT_STORAGE_DIRECTORY:.data/documents}
app.document.max-file-size=10MB
spring.servlet.multipart.max-file-size=${app.document.max-file-size}
spring.servlet.multipart.max-request-size=11MB
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
app.messaging.document-topic=knowflow.document.uploaded
app.messaging.dead-letter-topic=knowflow.document.uploaded.DLT
app.messaging.worker-group=knowflow-document-worker
app.outbox.poll-delay=1000
app.outbox.initial-delay=1000
app.embedding.enabled=${EMBEDDING_ENABLED:false}
app.embedding.base-url=${EMBEDDING_BASE_URL:https://api.openai.com/v1}
app.embedding.api-key=${EMBEDDING_API_KEY:}
app.embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}
app.embedding.dimensions=${EMBEDDING_DIMENSIONS:1536}
app.qdrant.url=${QDRANT_URL:http://localhost:6333}
app.qdrant.api-key=${QDRANT_API_KEY:}
app.bm25.enabled=${BM25_ENABLED:false}
app.bm25.directory=${BM25_DIRECTORY:.data/lucene}
app.rerank.enabled=${RERANK_ENABLED:false}
app.rerank.url=${RERANK_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
app.rerank.api-key=${RERANK_API_KEY:}
app.rerank.model=${RERANK_MODEL:gte-rerank-v2}
app.rerank.timeout=${RERANK_TIMEOUT:PT5S}
app.rerank.candidates=${RERANK_CANDIDATES:20}
app.chat.enabled=${CHAT_ENABLED:false}
app.chat.base-url=${CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
app.chat.api-key=${CHAT_API_KEY:}
app.chat.model=${CHAT_MODEL:qwen3.8-flash}
app.chat.max-tokens=${CHAT_MAX_TOKENS:512}
app.chat.timeout=${CHAT_TIMEOUT:PT20S}
app.chat.connect-timeout=${CHAT_CONNECT_TIMEOUT:PT5S}
app.chat.total-timeout=${CHAT_TOTAL_TIMEOUT:PT30S}
app.chat.first-token-timeout=${CHAT_FIRST_TOKEN_TIMEOUT:PT8S}
app.chat.idle-timeout=${CHAT_IDLE_TIMEOUT:PT8S}
app.chat.retries=${CHAT_RETRIES:0}
app.chat.fallback.enabled=${CHAT_FALLBACK_ENABLED:false}
app.chat.fallback.model=${CHAT_FALLBACK_MODEL:}
app.chat.fallback.base-url=${CHAT_FALLBACK_BASE_URL:${app.chat.base-url}}
app.chat.fallback.api-key=${CHAT_FALLBACK_API_KEY:${app.chat.api-key}}
app.chat.stream-deadline=${CHAT_STREAM_DEADLINE:PT30S}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.version=OPENAPI_3_0
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
