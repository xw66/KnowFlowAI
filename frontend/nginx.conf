server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }

    # Docker DNS 随 API 容器重建重新解析；不自动重放上传和问答 POST。
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:8080;
    location ~ ^/(api(?:/|$)|v3/api-docs(?:/|$)|swagger-ui(?:/|\.html$)) {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_next_upstream off;
    }
}
